<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Page not found — FlexiSpace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="/assets/svg/flexispace-icon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #f0f4ff 0%, #e8f0fe 40%, #f8faff 100%);
      color: #0b1b3b; text-align: center; padding: 24px;
    }
    .wrap { max-width: 520px; }
    .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo span { font-family: 'Geist', sans-serif; font-weight: 800; font-size: 22px; }
    .logo .accent { color: #1E5BFF; }
    .code { font-family: 'Geist', sans-serif; font-weight: 800; font-size: clamp(64px, 14vw, 112px); line-height: 1; color: #1E5BFF; letter-spacing: -.04em; }
    h1 { font-family: 'Geist', sans-serif; font-size: clamp(22px, 4vw, 30px); margin: 8px 0 12px; letter-spacing: -.02em; }
    p { color: #5a6478; font-size: 16px; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block; background: #1E5BFF; color: #fff; text-decoration: none;
      font-weight: 700; padding: 14px 28px; border-radius: 12px; font-size: 15px;
      box-shadow: 0 10px 24px -12px rgba(30,91,255,.6);
    }
    .btn:hover { background: #1749d6; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="logo" href="/">
      <svg width="30" height="30" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="4"  y="4"  width="24" height="24" rx="5" fill="#D6E0FF"/>
        <rect x="36" y="4"  width="24" height="24" rx="5" fill="#9DB7FF"/>
        <rect x="4"  y="36" width="24" height="24" rx="5" fill="#5E8CFF"/>
        <rect x="36" y="36" width="24" height="24" rx="5" fill="#1E5BFF"/>
        <circle cx="48" cy="48" r="4" fill="#fff"/>
      </svg>
      <span>Flexi<span class="accent">Space</span></span>
    </a>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back to managing your spaces.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
